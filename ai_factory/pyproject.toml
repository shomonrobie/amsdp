[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amsdp-ai-factory"
version = "0.1.0"
description = "CrewAI-based AMSDP AI Factory: controlled, auditable, gated software-development orchestration for AMSDP."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

# Runtime dependencies. Phase 1 declares the versions verified in the
# project's .venv313 environment (Python 3.13.15). Nothing is installed by
# this manifest at this stage; tests use the standard-library unittest and
# require no third-party test dependencies.
dependencies = [
    "crewai>=1.15.35,<2.0.0",
    "pydantic>=2.12,<3.0.0",
    "pydantic-settings>=2.16,<3.0.0",
    "pyyaml>=6.0,<7.0.0",
    "typer>=0.27,<1.0.0",
    "python-dotenv>=1.2,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
[project.scripts]
aili = "amsdp_ai_factory.cli:main"
amsdp_ai_factory = ["py.typed"]