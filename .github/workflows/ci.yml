# AMSDP continuous integration (owner decision Q-5, 2026-11-12).
#
# Until this file existed the repository had no pipeline at all: nothing ran the
# backend suite or built the frontend on a change.  Two independent jobs, each
# mirroring the runtime the images actually use:
#
#   backend  — Python 3.13 (same base as backend/*/Dockerfile py3.13-slim) against
#              PostgreSQL 16 (same tag as docker-compose.yml), schema created by
#              the approved Alembic chain, then the whole pytest suite.
#   frontend — Node 22 (frontend/Dockerfile node:22-alpine): npm ci, next build,
#              and the existing node:test suite.
#
# Every credential below is a CI-only literal on an ephemeral service container;
# no repository, deployment or demo secret is used, echoed or stored.
name: CI

on:
  push:
    branches: [main, hackathon-mvp]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — pytest on PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amsdp
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: amsdp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U amsdp -d amsdp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite talks to the service container on the same port the dev stack
      # publishes (5433); common.database reads AMSDP_DATABASE_URL.
      AMSDP_DATABASE_URL: postgresql+psycopg2://amsdp:ci-not-a-secret@127.0.0.1:5433/amsdp
      POSTGRES_PASSWORD: ci-not-a-secret
      # Development mode keeps the documented local JWT fallback: no secret is
      # invented here and none is required for the suite.
      AMSDP_ENV: development
      PYTHONPATH: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/**/requirements.txt
            backend/requirements-dev.txt

      # Runtime dependencies are declared per service (Q-5); install the union so
      # every service module the suite imports has its own packages available.
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          for req in $(find backend -name requirements.txt | sort); do
            echo "==> $req"
            python -m pip install -r "$req"
          done
          python -m pip install -r backend/requirements-dev.txt

      # The suite runs against a real schema, so apply the forward-only chain
      # exactly as deployment does instead of letting models create tables.
      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend — build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
